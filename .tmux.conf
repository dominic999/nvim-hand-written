##### PREFIX #####

set -g set-clipboard on
unbind C-b
set -g prefix M-a
bind M-a send-prefix

##### NUMBERING #####
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

##### TERMINAL / COLORS #####
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# undercurl + subliniere colorata (diagnostice LSP in Neovim)
set -ga terminal-overrides ",*:Smulx=\\E[4::%p1%dm,*:Setulc=\\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m"

##### GENERAL QUALITY OF LIFE #####
set -g mouse on
set -g history-limit 100000
set -g escape-time 10
set -sg repeat-time 300
set -g focus-events on
set -g allow-rename off
set -g detach-on-destroy off

##### SPLITS #####
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

##### RELOAD CONFIG #####
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

##### PANE NAVIGATION #####
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

##### RESIZE PANES #####
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### WINDOW NAVIGATION #####
bind -n M-Left previous-window
bind -n M-Right next-window

##### COPY MODE (VI KEYS) #####
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi r send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel

##### BETTER VISUALS #####
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#211712,fg=#eadfcc"
set -g message-style "bg=#d6b578,fg=#211712"
set -g message-command-style "bg=#d09a6b,fg=#211712"
set -g pane-border-style "fg=#695244"
set -g pane-active-border-style "fg=#d6b578"
set -g display-panes-active-colour "#d6b578"
set -g display-panes-colour "#c8b7a3"

##### STATUS BAR #####
set -g status-left-length 40
set -g status-right-length 120

set -g status-left "#[fg=#211712,bg=#86aaa1,bold] #{session_name} #[fg=#86aaa1,bg=#211712]│"
set -g status-right "#[fg=#c8b7a3,bg=#211712] #{pane_current_command} #[fg=#695244]│ #[fg=#eadfcc] %H:%M #[fg=#695244]│ #[fg=#eadfcc] %d-%m-%Y "

setw -g window-status-format " #[fg=#a99a88]#I #[fg=#c8b7a3]#W "
setw -g window-status-current-format " #[fg=#211712,bg=#9db58a,bold]#I #[fg=#211712,bg=#9db58a,bold]#W "
setw -g window-status-style "bg=#211712,fg=#a99a88"
setw -g window-status-current-style "bg=#9db58a,fg=#211712,bold"

##### LESS NOISE #####
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

##### EASY SESSIONIZER FEEL #####
bind c new-window -c "#{pane_current_path}"
bind n next-window
bind p previous-window

##### SWAP PANES #####
bind > swap-pane -D
bind < swap-pane -U
